<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Picionca Subtitle Studio</title><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');*{box-sizing:border-box}body{background:#101116;color:#eee;font:15px system-ui;margin:0}header{padding:22px;border-bottom:1px solid #333;font-size:22px;font-weight:bold}main{max-width:1200px;margin:auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:#1d1e26;padding:18px;border-radius:16px;min-width:0}video{display:block;width:100%;max-height:65vh;background:#090909;object-fit:contain}#stage{position:relative;display:grid;place-items:center}#caption{position:absolute;pointer-events:none;left:5%;right:5%;text-align:center;font-family:Montserrat,Arial Black,sans-serif;font-weight:900;color:white;text-shadow:0 2px 5px black,0 1px 2px black;overflow-wrap:anywhere}button,input,select{font:inherit;background:#30313d;color:white;border:1px solid #555;border-radius:8px;padding:9px;max-width:100%}button{cursor:pointer}button.primary{background:#a32b75;border:0;font-weight:bold}button:disabled{opacity:.4;cursor:default}label{display:block;margin:12px 0}#rows{max-height:350px;overflow:auto}.word{display:grid;grid-template-columns:35px 1fr 75px 75px 35px;gap:5px;margin:5px 0}.word input{width:100%;min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap}small{color:#bbb}@media(max-width:760px){main{grid-template-columns:1fr}}</style><header>🦄 Picionca Subtitle Studio <small> · v1.0.2</small></header><main><section><input id="file" type="file" accept="video/*"><p id="status" role="status">Carica un video per iniziare.</p><div id="stage"><video id="video" controls playsinline></video><div id="caption"></div></div><p><button id="preview" disabled>▶ Anteprima dall’inizio</button></p><p><small>Anteprima: i sottotitoli seguono il tempo del video.</small></p><div class="actions"><button class="primary" id="transcribe" disabled>Trascrivi automaticamente</button><button id="srt" disabled>Esporta SRT</button><button id="export" disabled>Esporta video</button></div></section><section><h2>Stile sottotitoli</h2><label>Lingua <select id="language"><option value="">Automatica</option><option value="italian" selected>Italiano</option><option value="english">Inglese</option><option value="spanish">Spagnolo</option></select></label><label>Animazione <select id="mode"><option value="progressive">Comparsa progressiva</option><option value="karaoke">Karaoke</option><option value="single">Una parola alla volta</option><option value="full">Frase completa</option></select></label><label>Dimensione (% larghezza video) <input id="size" type="range" min="3" max="10" step=".2" value="6"></label><label>Distanza dal basso (%) <input id="position" type="range" min="5" max="70" value="15"></label><label>Colore <input id="color" type="color" value="#ffffff"> Evidenziazione <input id="highlight" type="color" value="#ffda00"></label><label>Parole per blocco <input id="count" type="number" min="1" max="8" value="3"></label><label><input id="upper" type="checkbox" checked> Maiuscolo</label><h2>Editor parole</h2><small>Modifica testo, inizio e fine in secondi. Puoi aggiungere parole manualmente.</small><div id="rows"></div><button id="add">+ Parola</button></section></main><script type="module">
const $=id=>document.getElementById(id),v=$('video'),cap=$('caption');let words=[],url,busy=false,model;
$('preview').onclick=()=>{v.currentTime=0;v.play()};const status=s=>$('status').textContent=s;function buttons(){for(const id of ['transcribe','srt','export'])$(id).disabled=busy||!url||(id!=='transcribe'&&!words.length);$('file').disabled=busy;$('add').disabled=busy||!url;$('preview').disabled=busy||!url}
$('file').onchange=()=>{if(!$('file').files[0])return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL($('file').files[0]);v.src=url;words=[];rows();status('Video caricato. Avvia la trascrizione.');buttons()};
function rows(){const root=$('rows');root.replaceChildren();words.forEach((w,i)=>{const row=document.createElement('div');row.className='word';const seek=document.createElement('button');seek.textContent='▶';seek.title='Ascolta da questa parola';seek.onclick=()=>{v.currentTime=Math.max(0,w.start);v.play()};row.append(seek);for(const k of ['text','start','end']){const el=document.createElement('input');el.value=w[k];el.setAttribute('aria-label',k+' '+(i+1));if(k!=='text'){el.type='number';el.step='.01';el.min=0}el.oninput=()=>{w[k]=k==='text'?el.value:Math.max(0,Number(el.value)||0);draw()};row.append(el)}const del=document.createElement('button');del.textContent='×';del.onclick=()=>{words.splice(i,1);rows()};row.append(del);root.append(row)});buttons()}
$('add').onclick=()=>{words.push({text:'Parola',start:v.currentTime||0,end:(v.currentTime||0)+.5});words.sort((a,b)=>a.start-b.start);rows()};
function active(t){const n=Math.max(1,Math.min(8,Number($('count').value)||3));let i=words.findLastIndex(w=>t>=w.start);if(i<0)return [];const start=Math.floor(i/n)*n,end=Math.min(start+n,words.length),mode=$('mode').value;if(t>=words[end-1].end)return [];return words.slice(start,end).map((w,j)=>({text:$('upper').checked?w.text.toUpperCase():w.text,color:mode==='karaoke'&&start+j===i?$('highlight').value:$('color').value,index:start+j})).filter(w=>mode==='single'?w.index===i:mode==='progressive'?w.index<=i:true)}
function draw(){cap.replaceChildren();for(const w of active(v.currentTime)){const s=document.createElement('span');s.textContent=w.text+' ';s.style.color=w.color;cap.append(s)}const width=Math.min(v.clientWidth,v.clientHeight*v.videoWidth/v.videoHeight)||v.clientWidth,height=Math.min(v.clientHeight,width*v.videoHeight/v.videoWidth)||v.clientHeight;cap.style.fontSize=width*Number($('size').value)/100+'px';cap.style.bottom=((v.clientHeight-height)/2+height*Number($('position').value)/100)+'px'}function loop(){draw();requestAnimationFrame(loop)}loop();buttons();
$('transcribe').onclick=async()=>{busy=true;buttons();v.pause();try{status('Caricamento modello Whisper (la prima volta richiede internet)...');const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2');env.allowLocalModels=false;if(!model)model=await pipeline('automatic-speech-recognition','onnx-community/whisper-tiny_timestamped',{dtype:'q8',device:'wasm',progress_callback:p=>{if(p.status==='progress')status('Download modello: '+Math.round(p.progress||0)+'%')}});status('Estrazione audio...');const ac=new AudioContext();let b;try{b=await ac.decodeAudioData(await $('file').files[0].arrayBuffer())}finally{await ac.close()}const off=new OfflineAudioContext(1,Math.ceil(b.duration*16000),16000),src=off.createBufferSource();src.buffer=b;src.connect(off.destination);src.start();const audio=(await off.startRendering()).getChannelData(0);status('Trascrizione locale in corso...');const bDuration=b.duration;const opts={return_timestamps:'word',chunk_length_s:30,stride_length_s:5,task:'transcribe'};if($('language').value)opts.language=$('language').value;let result;let approximate=false;try{result=await model(audio,opts);const chunks=result.chunks||[];const valid=chunks.filter(c=>Number.isFinite(c.timestamp?.[0]));if(!valid.length||valid.filter((c,i)=>i>0&&c.timestamp[0]<=valid[i-1].timestamp[0]).length>valid.length*.2)throw Error('Invalid word timestamps')}catch(e){if(!/cross.attention|timestamp/i.test(e.message))throw e;status('Sincronizzazione precisa non disponibile: calcolo tempi stimati...');result=await model(audio,{...opts,return_timestamps:true});approximate=true;result.chunks=(result.chunks||[]).flatMap(c=>{const parts=c.text.trim().split(/\s+/).filter(Boolean),a=c.timestamp?.[0],b=c.timestamp?.[1]??bDuration;if(!Number.isFinite(a)||!parts.length)return [];const end=Math.max(a+.06,b);return parts.map((text,i)=>({text,timestamp:[a+(end-a)*i/parts.length,a+(end-a)*(i+1)/parts.length]}))})}words=(result.chunks||[]).filter(c=>c.timestamp&&Number.isFinite(c.timestamp[0])).map(c=>({text:c.text.trim(),start:c.timestamp[0],end:Math.max(c.timestamp[0]+.06,c.timestamp[1]??c.timestamp[0]+.5)}));words.sort((a,b)=>a.start-b.start);v.currentTime=0;rows();status(words.length?(approximate?'Trascrizione completata con tempi stimati: correggi la sincronizzazione nell’editor.':'Trascrizione completata. Controlla testo e tempi.'):'Nessuna parola rilevata.')}catch(e){status('Errore trascrizione: '+e.message+' — controlla la connessione o riprova; se il problema persiste comunica questo errore.')}finally{busy=false;buttons()}};
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}function stamp(t){const ms=Math.max(0,Math.round(t*1000));return new Date(ms).toISOString().slice(11,23).replace('.',',')}
$('srt').onclick=()=>{const n=Math.max(1,Math.min(8,Number($('count').value)||3)),out=[];for(let i=0;i<words.length;i+=n){const a=words.slice(i,i+n);out.push((out.length+1)+'\n'+stamp(a[0].start)+' --> '+stamp(a.at(-1).end)+'\n'+a.map(w=>w.text).join(' ')+'\n')}save(new Blob([out.join('\n')],{type:'text/plain'}),'sottotitoli.srt')};
$('export').onclick=async()=>{busy=true;buttons();let recorder,stream,frame,original;try{await document.fonts.load('900 24px Montserrat');v.pause();const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;if(!c.width)throw Error('Video non pronto');const ctx=c.getContext('2d');stream=c.captureStream(30);v.currentTime=0;await new Promise(r=>{if(!v.seeking)r();else v.addEventListener('seeked',r,{once:true})});original=v.captureStream();for(const track of original.getAudioTracks())stream.addTrack(track);const mime=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime)throw Error('Formato non supportato dal browser');const chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const stopped=new Promise(r=>recorder.onstop=r);const render=()=>{ctx.drawImage(v,0,0,c.width,c.height);const items=active(v.currentTime),size=c.width*Number($('size').value)/100;ctx.font='900 '+size+'px Montserrat, Arial Black, sans-serif';ctx.textBaseline='bottom';ctx.shadowColor='#000';ctx.shadowBlur=size*.12;ctx.shadowOffsetY=size*.07;const total=items.reduce((s,w)=>s+ctx.measureText(w.text+' ').width,0);let x=(c.width-total)/2;for(const w of items){ctx.fillStyle=w.color;ctx.fillText(w.text,x,c.height*(1-Number($('position').value)/100));x+=ctx.measureText(w.text+' ').width}ctx.shadowBlur=0;ctx.shadowOffsetY=0;frame=requestAnimationFrame(render)};render();recorder.start();await v.play();status('Esportazione in tempo reale: mantieni la scheda aperta.');await new Promise(r=>{if(v.ended)r();else v.addEventListener('ended',r,{once:true})});cancelAnimationFrame(frame);recorder.stop();await stopped;save(new Blob(chunks,{type:mime}),'picionca-sottotitoli.'+(mime.includes('mp4')?'mp4':'webm'));status('Esportazione completata.')}catch(e){status('Errore esportazione: '+e.message)}finally{if(frame)cancelAnimationFrame(frame);if(recorder?.state==='recording')recorder.stop();stream?.getVideoTracks().forEach(t=>t.stop());v.pause();busy=false;buttons()}};
</script></html>
